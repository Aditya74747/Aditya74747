
name: Update GitHub Projects in README

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project list
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const featured = [
              'mcp-agent-database',
              'legal-contract-analysis-ai',
              'hr-policy-rag'
            ];

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username: context.repo.owner,
                per_page: 100,
                sort: 'updated',
                direction: 'desc'
              }
            );

            const projects = repos
              .filter(repo =>
                !repo.fork &&
                !repo.archived &&
                !repo.private &&
                repo.name !== context.repo.owner &&
                !featured.includes(repo.name)
              )
              .sort((a, b) =>
                new Date(b.updated_at) - new Date(a.updated_at)
              );

            const escape = value =>
              String(value || '')
                .replace(/\|/g, '\\|')
                .replace(/\r?\n/g, ' ');

            let content = '';

            if (projects.length === 0) {
              content = 'No additional public projects yet.';
            } else {
              content = [
                '| Project | Description | Language | Last Updated |',
                '|---|---|---|---|',
                ...projects.map(repo => {
                  const description = escape(
                    repo.description || 'No description available.'
                  );

                  const language = escape(
                    repo.language || 'N/A'
                  );

                  const updated = new Date(
                    repo.updated_at
                  ).toISOString().slice(0, 10);

                  return `| [${escape(repo.name)}](${repo.html_url}) | ${description} | ${language} | ${updated} |`;
                })
              ].join('\n');
            }

            const readmePath = 'README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');

            const start = '<!-- AUTO-PROJECTS-START -->';
            const end = '<!-- AUTO-PROJECTS-END -->';

            if (
              !readme.includes(start) ||
              !readme.includes(end)
            ) {
              throw new Error('Project section markers not found.');
            }

            const before = readme.split(start)[0];
            const after = readme.split(end).slice(1).join(end);

            readme =
              `${before}${start}\n${content}\n${end}${after}`;

            fs.writeFileSync(readmePath, readme);

      - name: Commit README changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automatically update GitHub projects"
          file_pattern: README.md
